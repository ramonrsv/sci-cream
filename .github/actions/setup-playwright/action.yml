name: "Install Playwright Browsers"
description: "Install Playwright browsers and their system dependencies"
inputs:
  browsers:
    description: "Browsers to install (space-separated). Empty installs all of them."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Resolve Playwright version and cache key
      id: playwright
      shell: bash
      run: |
        cd ./packages/app
        query='.[0].devDependencies["@playwright/test"].version'
        version=$(pnpm list @playwright/test --json | jq -r "$query")
        # Key on the browser set too, so a chromium-only job cannot reuse an all-browsers entry.
        browsers=$(echo "${{ inputs.browsers }}" | tr -s ' ' '-' | sed 's/^-//;s/-$//')
        echo "cache-key=playwright-$RUNNER_OS-$version-${browsers:-all}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.playwright.outputs.cache-key }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cd ./packages/app && pnpm playwright install ${{ inputs.browsers }}

    - name: Install system dependencies
      shell: bash
      run: cd ./packages/app && pnpm playwright install-deps ${{ inputs.browsers }}
